services:
  postgres:
    image: pgvector/pgvector:pg16
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    # Native image: JVM apache/kafka crashes on Apple Silicon + recent macOS (SVE).
    image: apache/kafka-native:3.9.0
    hostname: kafka
    ports:
      - "${KAFKA_HOST_PORT}:9092"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      # kafka-topics.sh is JVM-based and fails on Apple Silicon; broker itself is native.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9092'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  ollama:
    image: ollama/ollama:0.40.13
    ports:
      - "${OLLAMA_PORT}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ollama-init:
    image: ollama/ollama:0.40.13
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "waiting for ollama..."
        until ollama list >/dev/null 2>&1; do sleep 2; done
        ollama pull ${OLLAMA_EMBEDDING_MODEL}
        ollama pull ${CHAT_MODEL}
    restart: "no"

  auth:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.auth
    env_file: .env
    environment:
      HTTP_PORT: ${HTTP_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL}
    ports:
      - "${AUTH_HOST_PORT}:${HTTP_PORT}"
    depends_on:
      postgres:
        condition: service_healthy

  intake:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.intake
    env_file: .env
    environment:
      HTTP_PORT: ${HTTP_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_QA_PAIR_TOPIC: ${KAFKA_QA_PAIR_TOPIC}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE}
    ports:
      - "${INTAKE_HOST_PORT}:${HTTP_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  template:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.template
    env_file: .env
    environment:
      HTTP_PORT: ${HTTP_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_TEMPLATE_TOPIC: ${KAFKA_TEMPLATE_TOPIC}
      KAFKA_TEMPLATE_GROUP: ${KAFKA_TEMPLATE_GROUP}
      TEMPLATE_CONSUMER_MAX_ATTEMPTS: ${TEMPLATE_CONSUMER_MAX_ATTEMPTS}
      TEMPLATE_CONSUMER_INITIAL_BACKOFF: ${TEMPLATE_CONSUMER_INITIAL_BACKOFF}
      TEMPLATE_CONSUMER_MAX_BACKOFF: ${TEMPLATE_CONSUMER_MAX_BACKOFF}
    ports:
      - "${TEMPLATE_HOST_PORT}:${HTTP_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  knowledge:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.knowledge
    env_file: .env
    environment:
      HTTP_PORT: ${HTTP_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_EMBEDDING_TOPIC: ${KAFKA_EMBEDDING_TOPIC}
      KAFKA_CLUSTER_TOPIC: ${KAFKA_CLUSTER_TOPIC}
      KAFKA_KNOWLEDGE_GROUP: ${KAFKA_KNOWLEDGE_GROUP}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD}
      SEARCH_LIMIT: ${SEARCH_LIMIT}
      GENERATION_THRESHOLD_N: ${GENERATION_THRESHOLD_N}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE}
      KNOWLEDGE_CONSUMER_MAX_ATTEMPTS: ${KNOWLEDGE_CONSUMER_MAX_ATTEMPTS}
      KNOWLEDGE_CONSUMER_INITIAL_BACKOFF: ${KNOWLEDGE_CONSUMER_INITIAL_BACKOFF}
      KNOWLEDGE_CONSUMER_MAX_BACKOFF: ${KNOWLEDGE_CONSUMER_MAX_BACKOFF}
    ports:
      - "${KNOWLEDGE_HOST_PORT}:${HTTP_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      embedding:
        condition: service_started

  generator:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.generator
    env_file: .env
    environment:
      HTTP_PORT: ${HTTP_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      LLM_BASE_URL: ${OLLAMA_BASE_URL}
      CHAT_MODEL: ${CHAT_MODEL}
      PROMPT_VERSION: ${PROMPT_VERSION}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS}
      MAX_OUTPUT_CHARS: ${MAX_OUTPUT_CHARS}
      MIN_OUTPUT_CHARS: ${MIN_OUTPUT_CHARS}
      INTAKE_BASE_URL: ${INTAKE_BASE_URL}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_CLUSTER_TOPIC: ${KAFKA_CLUSTER_TOPIC}
      KAFKA_TEMPLATE_TOPIC: ${KAFKA_TEMPLATE_TOPIC}
      KAFKA_GENERATOR_GROUP: ${KAFKA_GENERATOR_GROUP}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE}
      GENERATOR_CONSUMER_MAX_ATTEMPTS: ${GENERATOR_CONSUMER_MAX_ATTEMPTS}
      GENERATOR_CONSUMER_INITIAL_BACKOFF: ${GENERATOR_CONSUMER_INITIAL_BACKOFF}
      GENERATOR_CONSUMER_MAX_BACKOFF: ${GENERATOR_CONSUMER_MAX_BACKOFF}
    ports:
      - "${GENERATOR_HOST_PORT}:${HTTP_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      intake:
        condition: service_started
      ollama:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully

  embedding:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.embedding
    env_file: .env
    environment:
      HTTP_PORT: ${HTTP_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_QA_PAIR_TOPIC: ${KAFKA_QA_PAIR_TOPIC}
      KAFKA_EMBEDDING_TOPIC: ${KAFKA_EMBEDDING_TOPIC}
      KAFKA_EMBEDDING_GROUP: ${KAFKA_EMBEDDING_GROUP}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE}
      EMBEDDING_CONSUMER_MAX_ATTEMPTS: ${EMBEDDING_CONSUMER_MAX_ATTEMPTS}
      EMBEDDING_CONSUMER_INITIAL_BACKOFF: ${EMBEDDING_CONSUMER_INITIAL_BACKOFF}
      EMBEDDING_CONSUMER_MAX_BACKOFF: ${EMBEDDING_CONSUMER_MAX_BACKOFF}
    ports:
      - "${EMBEDDING_HOST_PORT}:${HTTP_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ollama:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  ollama_data:
