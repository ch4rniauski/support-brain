services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:0.40.13
    ports:
      - "${OLLAMA_PORT}:11434"
    volumes:
      - ollama_data:/root/.ollama

  auth:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.auth
    env_file: .env
    environment:
      HTTP_PORT: ${HTTP_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL}
    ports:
      - "${AUTH_HOST_PORT}:${HTTP_PORT}"
    depends_on:
      postgres:
        condition: service_healthy

  intake:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.intake
    env_file: .env
    environment:
      HTTP_PORT: ${HTTP_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL}
    ports:
      - "${INTAKE_HOST_PORT}:${HTTP_PORT}"
    depends_on:
      postgres:
        condition: service_healthy

  template:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.template
    env_file: .env
    environment:
      HTTP_PORT: ${HTTP_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${TEMPLATE_HOST_PORT}:${HTTP_PORT}"
    depends_on:
      postgres:
        condition: service_healthy

  knowledge:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.knowledge
    env_file: .env
    environment:
      HTTP_PORT: ${HTTP_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${KNOWLEDGE_HOST_PORT}:${HTTP_PORT}"
    depends_on:
      postgres:
        condition: service_healthy

  generator:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.generator
    env_file: .env
    environment:
      HTTP_PORT: ${HTTP_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
    ports:
      - "${GENERATOR_HOST_PORT}:${HTTP_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  embedding:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.embedding
    env_file: .env
    environment:
      HTTP_PORT: ${HTTP_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
    ports:
      - "${EMBEDDING_HOST_PORT}:${HTTP_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  postgres_data:
  ollama_data:
